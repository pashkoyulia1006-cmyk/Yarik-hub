<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yartal Hub | Global Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #b38d1d;
            --bg: #0f0f0f;
            --sidebar: #151515;
            --text: #e0e0e0;
            --danger: #ff4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: var(--sidebar);
            border-right: 1px solid #282828;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #282828; }
        .sidebar-header h1 { color: var(--primary); font-size: 0.9rem; margin: 0; letter-spacing: 1px; line-height: 1.4; }

        .admin-status { font-size: 10px; color: #555; text-transform: uppercase; margin-top: 5px; }
        .admin-status.active { color: var(--primary); font-weight: bold; }

        .create-area, .search-area { padding: 15px; border-bottom: 1px solid #282828; }
        input {
            width: 100%; padding: 10px; background: #222; border: 1px solid #333;
            color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px;
        }

        .btn {
            width: 100%; padding: 10px; background: var(--primary); border: none;
            color: black; font-weight: bold; cursor: pointer; border-radius: 5px;
        }

        #groupsList { flex-grow: 1; overflow-y: auto; padding: 10px; }
        
        .group-item {
            padding: 12px; background: #1e1e1e; margin-bottom: 8px; border-radius: 5px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid transparent;
        }
        .group-item:hover { background: #252525; }
        .group-item.active { border-left-color: var(--primary); background: #252525; }

        .del-btn { color: #555; display: none; font-weight: bold; padding: 0 5px; }
        .del-btn:hover { color: var(--danger); }
        body.is-admin .del-btn { display: block; }

        .chat-main { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        #chatHeader {
            padding: 15px 25px; background: #111; border-bottom: 1px solid #282828;
            display: flex; justify-content: space-between; align-items: center;
        }

        #messagesBox { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #222; color: white; align-self: flex-start; padding: 10px; border-radius: 10px; max-width: 70%; word-wrap: break-word; }
        .message.mine { background: var(--primary); color: black; align-self: flex-end; }

        .input-box { padding: 20px; background: #151515; display: flex; gap: 10px; }
    </style>
</head>
<body id="mainBody">

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>YARTAL HUB<br><span style="font-size: 0.7rem; color: #777;">Створено Ярославом Пашком</span></h1>
            <div id="adminStatus" class="admin-status">Гість</div>
        </div>
        <div class="create-area">
            <input type="text" id="groupInput" placeholder="Назва гільдії...">
            <button class="btn" id="createBtn">СТВОРИТИ</button>
        </div>
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Пошук (або пароль)...">
        </div>
        <div id="groupsList"></div>
    </div>

    <div class="chat-main">
        <div id="chatHeader">
            <span id="headerTitle">Оберіть гільдію</span>
        </div>
        <div id="messagesBox"></div>
        <div class="input-box" id="msgArea" style="display: none;">
            <input type="text" id="msgInput" placeholder="Повідомлення..." style="margin:0;">
            <button class="btn" id="sendBtn" style="width: 80px;">➤</button>
        </div>
    </div>

    <script>
        // --- НАЛАШТУВАННЯ FIREBASE ---
        // УВАГА: Заміни ці дані на свої з консолі Firebase, щоб база працювала вічно.
        // Поки що стоїть демо-конфігурація (вона може мати ліміти).
        const firebaseConfig = {
            apiKey: "AIzaSyAs-DEMO-ONLY",
            databaseURL: "https://yartal-hub-default-rtdb.firebaseio.com", 
            projectId: "yartal-hub"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- ДАНІ ---
        let groups = [];
        let activeId = null;
        let isAdmin = false;
        const ADMIN_PASS = "admin123"; 

        const elements = {
            searchInput: document.getElementById('searchInput'),
            body: document.getElementById('mainBody'),
            status: document.getElementById('adminStatus'),
            groupsList: document.getElementById('groupsList'),
            messagesBox: document.getElementById('messagesBox'),
            headerTitle: document.getElementById('headerTitle'),
            msgArea: document.getElementById('msgArea'),
            msgInput: document.getElementById('msgInput')
        };

        // --- СИНХРОНІЗАЦІЯ З ХМАРОЮ ---
        function saveToCloud() {
            db.ref('groups').set(groups);
        }

        // Слухаємо базу даних у реальному часі
        db.ref('groups').on('value', (snapshot) => {
            const data = snapshot.val();
            groups = data || [];
            renderGroups(elements.searchInput.value);
            if (activeId) renderMessages();
        });

        function renderGroups(filter = "") {
            elements.groupsList.innerHTML = '';
            groups.forEach(g => {
                if (g.name.toLowerCase().includes(filter.toLowerCase())) {
                    const div = document.createElement('div');
                    div.className = 'group-item' + (g.id === activeId ? ' active' : '');
                    div.innerHTML = `
                        <span># ${g.name}</span>
                        <span class="del-btn" onclick="deleteGroup(event, ${g.id})">×</span>
                    `;
                    div.onclick = () => openChat(g.id);
                    elements.groupsList.appendChild(div);
                }
            });
        }

        function openChat(id) {
            activeId = id;
            const group = groups.find(g => g.id === id);
            elements.headerTitle.innerText = "# " + group.name;
            elements.msgArea.style.display = 'flex';
            renderMessages();
            renderGroups(elements.searchInput.value);
        }

        function renderMessages() {
            elements.messagesBox.innerHTML = '';
            const group = groups.find(g => g.id === activeId);
            if (!group || !group.messages) return;
            
            group.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = 'message' + (m.admin ? ' mine' : '');
                div.innerHTML = `<small style="display:block; font-size:10px; opacity:0.6;">${m.user}</small>${m.text}`;
                elements.messagesBox.appendChild(div);
            });
            elements.messagesBox.scrollTop = elements.messagesBox.scrollHeight;
        }

        // --- ДІЇ ---
        document.getElementById('createBtn').onclick = () => {
            const name = document.getElementById('groupInput').value.trim();
            if (name) {
                const newGroup = { id: Date.now(), name, messages: [] };
                groups.push(newGroup);
                saveToCloud();
                document.getElementById('groupInput').value = '';
            }
        };

        document.getElementById('sendBtn').onclick = sendMessage;
        elements.msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

        function sendMessage() {
            const text = elements.msgInput.value.trim();
            if (text && activeId) {
                const groupIdx = groups.findIndex(g => g.id === activeId);
                if (!groups[groupIdx].messages) groups[groupIdx].messages = [];
                
                groups[groupIdx].messages.push({
                    text: text,
                    user: isAdmin ? "Адмін" : "Користувач",
                    admin: isAdmin
                });
                
                saveToCloud();
                elements.msgInput.value = '';
            }
        }

        function deleteGroup(event, id) {
            event.stopPropagation();
            if (!isAdmin) return;
            if (confirm("Видалити цю гільдію для всіх?")) {
                groups = groups.filter(g => g.id !== id);
                if (activeId === id) activeId = null;
                saveToCloud();
            }
        }

        elements.searchInput.oninput = (e) => {
            if (e.target.value === ADMIN_PASS) {
                isAdmin = true;
                elements.body.classList.add('is-admin');
                elements.status.innerText = "Режим Адміна: Увімкнено";
                elements.status.classList.add('active');
                elements.searchInput.value = "";
                renderGroups();
            } else {
                renderGroups(e.target.value);
            }
        };
    </script>
</body>
</html>
