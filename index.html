<script>
    // 1. Перевіряємо, чи працює пам'ять браузера
    let groups = [];
    try {
        const saved = localStorage.getItem('yartal_v3');
        if (saved) groups = JSON.parse(saved);
        console.log("Дані завантажено:", groups);
    } catch (e) {
        alert("Помилка доступу до пам'яті: " + e.message);
    }

    let activeId = null;

    function save() {
        localStorage.setItem('yartal_v3', JSON.stringify(groups));
    }

    function createGroup() {
        console.log("Спроба створити групу...");
        const input = document.getElementById('groupNameInput');
        
        if (!input) {
            alert("Помилка: Поле вводу не знайдено в HTML!");
            return;
        }

        const name = input.value.trim();
        
        if (!name) {
            alert("Напишіть хоча б одну букву в назву!");
            return;
        }

        const newGroup = {
            id: Date.now(),
            name: name,
            messages: []
        };

        groups.push(newGroup);
        save();
        input.value = '';
        renderGroups();
        alert("Гільдію '" + name + "' успішно створено!");
    }

    function renderGroups() {
        const list = document.getElementById('groupsList');
        if (!list) return;
        
        list.innerHTML = '';
        groups.forEach(g => {
            const div = document.createElement('div');
            div.className = 'group-item';
            div.innerHTML = `<strong># ${g.name}</strong>`;
            div.onclick = () => alert("Ви обрали чат: " + g.name);
            list.appendChild(div);
        });
    }

    // Запускаємо першу відрисовку
    renderGroups();
</script>
