<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yartal Hub | Спільноти та Пошук</title>
    <style>
        :root {
            --primary: #b38d1d;
            --primary-hover: #d4a724;
            --bg-dark: #0f0f0f;
            --sidebar-bg: #151515;
            --text-main: #e0e0e0;
            --accent: #00ff88;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #282828;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #282828;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
        }

        /* Поле пошуку */
        .search-box {
            padding: 10px 15px;
            background: #1a1a1a;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .create-box {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #282828;
        }

        input, textarea {
            background: #252525;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
        }

        .btn-create {
            background: var(--primary);
            color: black;
            font-weight: bold;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        #groupsList {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .group-item {
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .group-item:hover { background: #252525; }
        .group-item.active { background: #2d2d2d; border-left: 3px solid var(--primary); }

        /* --- CHAT --- */
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 25px;
            background: #111;
            border-bottom: 1px solid #282828;
        }

        #messagesBox {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .msg-sent { background: var(--primary); color: black; align-self: flex-end; }
        .msg-received { background: #2a2a2a; align-self: flex-start; }

        .input-area {
            padding: 20px;
            background: #151515;
            display: flex;
            gap: 10px;
        }

        .input-area input { flex-grow: 1; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Yartal Hub</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Пошук гільдії..." oninput="filterGroups()">
        </div>
        
        <div class="create-box">
            <input type="text" id="groupName" placeholder="Назва нової групи...">
            <button class="btn-create" onclick="createGroup()">+ Створити</button>
        </div>

        <div id="groupsList"></div>
    </div>

    <div class="main-chat">
        <div id="welcomeScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; opacity: 0.3;">
            <h2>Виберіть гільдію для входу в чат</h2>
        </div>

        <div id="chatContent" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <h2 id="currentGroupName" style="margin:0">Назва</h2>
            </div>
            <div id="messagesBox"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Ваше повідомлення..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="btn-create" onclick="sendMsg()">></button>
            </div>
        </div>
    </div>

    <script>
        let groups = JSON.parse(localStorage.getItem('yartal_groups')) || [];
        let activeId = null;
        let searchTerm = ""; // Змінна для фільтрації

        function save() {
            localStorage.setItem('yartal_groups', JSON.stringify(groups));
        }

        function createGroup() {
            const name = document.getElementById('groupName').value.trim();
            if (!name) return;
            const newGroup = { id: Date.now(), name: name, messages: [] };
            groups.push(newGroup);
            document.getElementById('groupName').value = '';
            save();
            renderGroups();
        }

        // Функція для фільтрації (оновлюється при кожному натисканні клавіші)
        function filterGroups() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase();
            renderGroups();
        }

        function renderGroups() {
            const list = document.getElementById('groupsList');
            list.innerHTML = '';
            
            // Фільтруємо масив перед відображенням
            const filtered = groups.filter(g => g.name.toLowerCase().includes(searchTerm));

            filtered.forEach(g => {
                const div = document.createElement('div');
                div.className = `group-item ${g.id === activeId ? 'active' : ''}`;
                div.innerHTML = `<strong># ${g.name}</strong>`;
                div.onclick = () => openChat(g.id);
                list.appendChild(div);
            });
        }

        function openChat(id) {
            activeId = id;
            const group = groups.find(g => g.id === id);
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            document.getElementById('currentGroupName').innerText = group.name;
            renderGroups();
            renderMessages();
        }
