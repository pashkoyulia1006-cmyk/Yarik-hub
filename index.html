<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yartal Hub | Офіційна версія</title>
    <style>
        :root {
            --primary: #b38d1d;
            --bg: #0f0f0f;
            --sidebar: #151515;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ЛІВА ПАНЕЛЬ --- */
        .sidebar {
            width: 300px;
            background: var(--sidebar);
            border-right: 1px solid #282828;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #282828;
        }

        .sidebar-header h1 {
            color: var(--primary);
            font-size: 1.2rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .create-area {
            padding: 15px;
            border-bottom: 1px solid #282828;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }

        .btn:hover { background: #d4a724; }

        #groupsList {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .group-item {
            padding: 12px;
            background: #1e1e1e;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            border-left: 4px solid transparent;
            display: flex;
            justify-content: space-between;
        }

        .group-item:hover { background: #252525; }
        .group-item.active { border-left-color: var(--primary); background: #252525; }

        .del-btn { color: #666; cursor: pointer; padding: 0 5px; }
        .del-btn:hover { color: #ff4444; }

        /* --- ЗОНА ЧАТУ --- */
        .chat-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #chatHeader {
            padding: 15px 25px;
            background: #111;
            border-bottom: 1px solid #282828;
            font-weight: bold;
        }

        #messagesBox {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 10px;
            background: #2a2a2a;
            align-self: flex-start;
        }

        .message.mine {
            background: var(--primary);
            color: black;
            align-self: flex-end;
        }

        .input-box {
            padding: 20px;
            background: #151515;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>YARTAL HUB</h1>
        </div>
        
        <div class="create-area">
            <input type="text" id="groupInput" placeholder="Назва гільдії...">
            <button class="btn" id="createBtn">СТВОРИТИ</button>
        </div>

        <div id="groupsList"></div>
    </div>

    <div class="chat-main">
        <div id="chatHeader">Оберіть гільдію</div>
        <div id="messagesBox"></div>
        
        <div class="input-box" id="msgArea" style="display: none;">
            <input type="text" id="msgInput" placeholder="Повідомлення..." style="margin:0;">
            <button class="btn" id="sendBtn" style="width: 80px;">></button>
        </div>
    </div>

    <script>
        // --- ДАНІ ---
        let groups = JSON.parse(localStorage.getItem('yartal_save')) || [];
        let activeId = null;

        // --- ЕЛЕМЕНТИ ---
        const groupInput = document.getElementById('groupInput');
        const createBtn = document.getElementById('createBtn');
        const groupsList = document.getElementById('groupsList');
        const messagesBox = document.getElementById('messagesBox');
        const chatHeader = document.getElementById('chatHeader');
        const msgArea = document.getElementById('msgArea');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        // --- ФУНКЦІЇ ---

        function save() {
            localStorage.setItem('yartal_save', JSON.stringify(groups));
        }

        function renderGroups() {
            groupsList.innerHTML = '';
            groups.forEach(g => {
                const div = document.createElement('div');
                div.className = 'group-item' + (g.id === activeId ? ' active' : '');
                div.innerHTML = `<span># ${g.name}</span> <span class="del-btn" onclick="deleteGroup(event, ${g.id})">×</span>`;
                div.onclick = () => openChat(g.id);
                groupsList.appendChild(div);
            });
        }

        function openChat(id) {
            activeId = id;
            const group = groups.find(g => g.id === id);
            chatHeader.innerText = "# " + group.name;
            msgArea.style.display = 'flex';
            renderMessages();
            renderGroups();
        }

        function renderMessages() {
            messagesBox.innerHTML = '';
            const group = groups.find(g => g.id === activeId);
            if (!group) return;

            group.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = 'message mine';
                div.innerText = m;
                messagesBox.appendChild(div);
            });
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function deleteGroup(e, id) {
            e.stopPropagation();
            groups = groups.filter(g => g.id !== id);
            if (activeId === id) {
                activeId = null;
                msgArea.style.display = 'none';
                chatHeader.innerText = "Оберіть гільдію";
                messagesBox.innerHTML = '';
            }
            save();
            renderGroups();
        }

        // --- ПОДІЇ ---

        // Кнопка створення
        createBtn.addEventListener('click', () => {
            const name = groupInput.value.trim();
            if (!name) {
                alert("Введіть назву!");
                return;
            }
            const newGroup = { id: Date.now(), name: name, messages: [] };
            groups.push(newGroup);
            save();
            groupInput.value = '';
            renderGroups();
