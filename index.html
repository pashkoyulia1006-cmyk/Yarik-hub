<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Yarthal hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; display: flex; height: 100vh; }
        
        /* Ліва панель (Створення та список) */
        .sidebar { width: 40%; border-right: 1px solid #333; padding: 20px; overflow-y: auto; background: #1a1a1a; }
        
        /* Права панель (Чат) */
        .chat-container { width: 60%; display: flex; flex-direction: column; background: #141414; position: relative; }
        
        .group-card { 
            background: #252525; border-left: 4px solid #b38d1d; padding: 15px; 
            margin-bottom: 15px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .group-card:hover { background: #333; }
        .group-card.active { border-left-color: #00ff88; background: #2d2d2d; }

        input, textarea { 
            width: 100%; padding: 10px; margin-bottom: 10px; 
            background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box;
        }
        
        button { 
            background: #b38d1d; border: none; padding: 10px; cursor: pointer; 
            color: white; font-weight: bold; border-radius: 5px; width: 100%;
        }

        /* Стилі чату */
        #chat-header { padding: 15px; background: #1f1f1f; border-bottom: 1px solid #333; font-weight: bold; color: #b38d1d; }
        #messages-box { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #333; padding: 8px 12px; border-radius: 10px; max-width: 80%; width: fit-content; }
        .message.my-msg { align-self: flex-end; background: #b38d1d; color: black; }
        
        #chat-input-area { padding: 15px; display: flex; gap: 10px; background: #1f1f1f; }
        #chat-input-area input { margin-bottom: 0; }
        #chat-input-area button { width: auto; }
        
        .empty-chat { text-align: center; color: #555; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Спільноти Яртала</h2>
        <div style="margin-bottom: 20px; padding: 10px; border: 1px solid #444; border-radius: 8px;">
            <input type="text" id="groupName" placeholder="Назва гільдії">
            <textarea id="groupDesc" placeholder="Опис" rows="2"></textarea>
            <button onclick="createGroup()">Створити гільдію</button>
        </div>
        <div id="groupsList"></div>
    </div>

    <div class="chat-container" id="chatWindow">
        <div id="chat-header">Виберіть спільноту, щоб почати чат</div>
        <div id="messages-box">
            <p class="empty-chat">Тут з'являться ваші повідомлення...</p>
        </div>
        <div id="chat-input-area" style="display: none;">
            <input type="text" id="msgText" placeholder="Напишіть щось..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" style="width: 80px;">Відправити</button>
        </div>
    </div>

    <script>
        let groups = [];
        let activeGroupId = null;

        function createGroup() {
            const name = document.getElementById('groupName').value.trim();
            const desc = document.getElementById('groupDesc').value.trim();

            if (!name) return alert("Введіть назву!");

            const newGroup = {
                id: Date.now(),
                name: name,
                description: desc,
                messages: [] // Масив для зберігання повідомлень цієї групи
            };

            groups.push(newGroup);
            document.getElementById('groupName').value = '';
            document.getElementById('groupDesc').value = '';
            renderGroups();
        }

        function renderGroups() {
            const list = document.getElementById('groupsList');
            list.innerHTML = '';
            groups.forEach(g => {
                const isActive = g.id === activeGroupId ? 'active' : '';
                list.innerHTML += `
                    <div class="group-card ${isActive}" onclick="openChat(${g.id})">
                        <strong>${g.name}</strong>
                        <p style="font-size: 0.8em; margin: 5px 0 0 0; opacity: 0.7;">${g.description}</p>
                    </div>
                `;
            });
        }

        function openChat(id) {
            activeGroupId = id;
            const group = groups.find(g => g.id === id);
            
            document.getElementById('chat-header').innerText = `Чат гільдії: ${group.name}`;
            document.getElementById('chat-input-area').style.display = 'flex';
            
            renderGroups(); // Оновлюємо вигляд списку (підсвітка)
            renderMessages();
        }

        function sendMessage() {
            const input = document.getElementById('msgText');
            const text = input.value.trim();
            
            if (!text || activeGroupId === null) return;

            const group = groups.find(g => g.id === activeGroupId);
            group.messages.push({
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });

            input.value = '';
            renderMessages();
        }

        function renderMessages() {
            const box = document.getElementById('messages-box');
            const group = groups.find(g => g.id === activeGroupId);
            
            box.innerHTML = '';
            group.messages.forEach(m => {
                box.innerHTML += `
                    <div class="message my-msg">
                        <div>${m.text}</div>
                        <div style="font-size: 0.6em; text-align: right; opacity: 0.6;">${m.time}</div>
                    </div>
                `;
            });
            
            // Авто-прокрутка вниз
            box.scrollTop = box.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
