<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yartal Hub </title>
    <style>
        :root {
            --primary: #b38d1d;
            --bg: #0f0f0f;
            --sidebar: #151515;
            --text: #e0e0e0;
            --danger: #ff4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            background: var(--sidebar);
            border-right: 1px solid #282828;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #282828; }
        .sidebar-header h1 { color: var(--primary); font-size: 1.2rem; margin: 0; letter-spacing: 2px; }

        .admin-status { font-size: 10px; color: #555; text-transform: uppercase; margin-top: 5px; }
        .admin-status.active { color: var(--primary); font-weight: bold; }

        .create-area, .search-area { padding: 15px; border-bottom: 1px solid #282828; }
        input {
            width: 100%; padding: 10px; background: #222; border: 1px solid #333;
            color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px;
        }

        .btn {
            width: 100%; padding: 10px; background: var(--primary); border: none;
            color: black; font-weight: bold; cursor: pointer; border-radius: 5px;
        }

        #groupsList { flex-grow: 1; overflow-y: auto; padding: 10px; }
        
        .group-item {
            padding: 12px; background: #1e1e1e; margin-bottom: 8px; border-radius: 5px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid transparent;
        }
        .group-item:hover { background: #252525; }
        .group-item.active { border-left-color: var(--primary); background: #252525; }

        /* Кнопка видалення (прихована за замовчуванням) */
        .del-btn { 
            color: #555; display: none; font-weight: bold; padding: 0 5px; 
        }
        .del-btn:hover { color: var(--danger); }
        
        /* Клас, який покаже кнопки, якщо ти адмін */
        body.is-admin .del-btn { display: block; }

        /* --- CHAT --- */
        .chat-main { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        #chatHeader {
            padding: 15px 25px; background: #111; border-bottom: 1px solid #282828;
            display: flex; justify-content: space-between; align-items: center;
        }
        .call-btn { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        #messagesBox { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message.mine { background: var(--primary); color: black; align-self: flex-end; padding: 10px; border-radius: 10px; max-width: 70%; }

        .input-box { padding: 20px; background: #151515; display: flex; gap: 10px; }
    </style>
</head>
<body id="mainBody">

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>YARTAL HUB(Створено Ярославом Пашком Васильовичом)</h1>
            <div id="adminStatus" class="admin-status">Гість</div>
        </div>
        <div class="create-area">
            <input type="text" id="groupInput" placeholder="Назва гільдії...">
            <button class="btn" id="createBtn">СТВОРИТИ</button>
        </div>
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Пошук (або пароль)...">
        </div>
        <div id="groupsList"></div>
    </div>

    <div class="chat-main">
        <div id="chatHeader">
            <span id="headerTitle">Оберіть гільдію</span>
            <button id="startCall" class="call-btn" style="display: none;">ВІДЕОДЗВІНОК</button>
        </div>
        <div id="messagesBox"></div>
        <div class="input-box" id="msgArea" style="display: none;">
            <input type="text" id="msgInput" placeholder="Повідомлення..." style="margin:0;">
            <button class="btn" id="sendBtn" style="width: 80px;">➤</button>
        </div>
    </div>

    <script>
        let groups = JSON.parse(localStorage.getItem('yartal_save')) || [];
        let activeId = null;
        let isAdmin = false;
        
        // --- Твій секретний пароль ---
        const ADMIN_PASS = "admin123"; 

        const elements = {
            searchInput: document.getElementById('searchInput'),
            body: document.getElementById('mainBody'),
            status: document.getElementById('adminStatus'),
            groupsList: document.getElementById('groupsList'),
            messagesBox: document.getElementById('messagesBox'),
            headerTitle: document.getElementById('headerTitle'),
            msgArea: document.getElementById('msgArea'),
            startCall: document.getElementById('startCall')
        };

        function save() { localStorage.setItem('yartal_save', JSON.stringify(groups)); }

        function renderGroups(filter = "") {
            elements.groupsList.innerHTML = '';
            groups.filter(g => g.name.toLowerCase().includes(filter.toLowerCase())).forEach(g => {
                const div = document.createElement('div');
                div.className = 'group-item' + (g.id === activeId ? ' active' : '');
                div.innerHTML = `
                    <span># ${g.name}</span>
                    <span class="del-btn" onclick="deleteGroup(event, ${g.id})">×</span>
                `;
                div.onclick = () => openChat(g.id);
                elements.groupsList.appendChild(div);
            });
        }

        // ПЕРЕВІРКА НА АДМІНА
        elements.searchInput.oninput = (e) => {
            const val = e.target.value;
            if (val === ADMIN_PASS) {
                isAdmin = true;
                elements.body.classList.add('is-admin');
                elements.status.innerText = "Режим Адміна: Увімкнено";
                elements.status.classList.add('active');
                elements.searchInput.value = ""; // Очищуємо після входу
                renderGroups();
            } else {
                renderGroups(val);
            }
        };

        function deleteGroup(event, id) {
            event.stopPropagation();
            if (!isAdmin) return; // Захист рівня коду
            
            if (confirm("Видалити цю гільдію назавжди?")) {
                groups = groups.filter(g => g.id !== id);
                if (activeId === id) {
                    activeId = null;
                    elements.msgArea.style.display = 'none';
                    elements.headerTitle.innerText = "Оберіть гільдію";
                }
                save();
                renderGroups();
            }
        }

        function openChat(id) {
            activeId = id;
            const group = groups.find(g => g.id === id);
            elements.headerTitle.innerText = "# " + group.name;
            elements.msgArea.style.display = 'flex';
            elements.startCall.style.display = 'block';
            renderMessages();
            renderGroups(elements.searchInput.value);
        }

        function renderMessages() {
            elements.messagesBox.innerHTML = '';
            const group = groups.find(g => g.id === activeId);
            if (!group) return;
            group.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = 'message mine';
                div.innerText = m;
                elements.messagesBox.appendChild(div);
            });
            elements.messagesBox.scrollTop = elements.messagesBox.scrollHeight;
        }

        document.getElementById('createBtn').onclick = () => {
            const name = document.getElementById('groupInput').value.trim();
            if (name) {
                groups.push({ id: Date.now(), name, messages: [] });
                save();
                document.getElementById('groupInput').value = '';
                renderGroups();
            }
        };

        document.getElementById('sendBtn').onclick = () => {
            const text = document.getElementById('msgInput').value.trim();
            if (text && activeId) {
                groups.find(g => g.id === activeId).messages.push(text);
                save();
                document.getElementById('msgInput').value = '';
                renderMessages();
            }
        };

        renderGroups();
    </script>
</body>
</html>
