<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yartal Hub | Спільноти</title>
    <style>
        :root {
            --primary: #b38d1d;
            --primary-hover: #d4a724;
            --bg-dark: #0f0f0f;
            --sidebar-bg: #151515;
            --text-main: #e0e0e0;
            --accent: #ff4444; /* Для видалення */
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #282828;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .search-box { padding: 10px 15px; }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: #222;
            border: 1px solid #333;
            border-radius: 20px;
            color: white;
            box-sizing: border-box;
        }

        .create-box {
            padding: 15px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #282828;
        }

        .create-box input { flex-grow: 1; background: #222; border: 1px solid #333; color: white; border-radius: 8px; padding: 8px; }

        .btn-primary {
            background: var(--primary);
            color: black;
            font-weight: bold;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover { background: var(--primary-hover); }

        #groupsList {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .group-item:hover { background: #252525; }
        .group-item.active { background: #2d2d2d; border-left: 4px solid var(--primary); }

        .btn-delete {
            background: transparent;
            color: #555;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }

        .btn-delete:hover { color: var(--accent); }

        /* --- CHAT --- */
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0f0f0f 100%);
        }

        .chat-header {
            padding: 18px 25px;
            background: rgba(21, 21, 21, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #282828;
        }

        #messagesBox {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 65%;
            padding: 10px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg-sent { background: var(--primary); color: black; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-received { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }

        .input-area {
            padding: 20px;
            background: #151515;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex-grow: 1;
            background: #252525;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 10px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header"><h1>YARTAL HUB</h1></div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Пошук гільдії..." oninput="filterGroups()">
        </div>
        
        <div class="create-box">
            <input type="text" id="groupName" placeholder="Назва гільдії...">
            <button class="btn-primary" onclick="createGroup()">+</button>
        </div>

        <div id="groupsList"></div>
    </div>

    <div class="main-chat">
        <div id="welcomeScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
            <h2 style="opacity: 0.3;">Оберіть гільдію для початку</h2>
        </div>

        <div id="chatContent" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <h2 id="currentGroupName" style="margin:0; font-size: 1.2rem;"></h2>
            </div>
            <div id="messagesBox"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Напишіть повідомлення..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="btn-primary" onclick="sendMsg()">Надіслати</button>
            </div>
        </div>
    </div>

    <script>
        let groups = JSON.parse(localStorage.getItem('yartal_groups')) || [];
        let activeId = null;
        let searchTerm = "";

        const save = () => localStorage.setItem('yartal_groups', JSON.stringify(groups));

        function createGroup() {
            const input = document.getElementById('groupName');
            const name = input.value.trim();
            if (!name) return;
            
            const newGroup = { id: Date.now(), name: name, messages: [] };
            groups.push(newGroup);
            input.value = '';
            save();
            renderGroups();
        }

        function deleteGroup(id, event) {
            event.stopPropagation(); // Щоб не відкривався чат при видаленні
            if (!confirm("Видалити цю гільдію?")) return;
            groups = groups.filter(g => g.id !== id);
            if (activeId === id) {
                activeId = null;
                document.getElementById('chatContent').style.display = 'none';
                document.getElementById('welcomeScreen').style.display = 'flex';
            }
            save();
            renderGroups();
        }

        function filterGroups() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase();
            renderGroups();
        }

        function renderGroups() {
            const list = document.getElementById('groupsList');
            list.innerHTML = '';
            
            const filtered = groups.filter(g => g.name.toLowerCase().includes(searchTerm));

            filtered.forEach(g => {
                const div = document.createElement('div');
                div.className = `group-item ${g.id === activeId ? 'active' : ''}`;
                div.onclick = () => openChat(g.id);
                div.innerHTML = `
                    <strong># ${g.name}</strong>
                    <button class="btn-delete" onclick="deleteGroup(${g.id}, event)">×</button>
                `;
                list.appendChild(div);
            });
        }

        function openChat(id) {
            activeId = id;
            const group = groups.find(g => g.id === id);
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            document.getElementById('currentGroupName').innerText = `# ${group.name}`;
            renderGroups();
            renderMessages();
        }
