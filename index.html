<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yartal Hub | Video Edition</title>
    <style>
        :root {
            --primary: #b38d1d;
            --bg: #0f0f0f;
            --sidebar: #151515;
            --text: #e0e0e0;
            --danger: #ff4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            background: var(--sidebar);
            border-right: 1px solid #282828;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #282828; }
        .sidebar-header h1 { color: var(--primary); font-size: 1.2rem; margin: 0; letter-spacing: 2px; }

        .create-area, .search-area { padding: 15px; border-bottom: 1px solid #282828; }
        input {
            width: 100%; padding: 10px; background: #222; border: 1px solid #333;
            color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px;
        }

        .btn {
            width: 100%; padding: 10px; background: var(--primary); border: none;
            color: black; font-weight: bold; cursor: pointer; border-radius: 5px;
        }

        #groupsList { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .group-item {
            padding: 12px; background: #1e1e1e; margin-bottom: 8px; border-radius: 5px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .group-item.active { border-left: 4px solid var(--primary); background: #252525; }

        /* --- CHAT & VIDEO --- */
        .chat-main { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        
        #chatHeader {
            padding: 15px 25px; background: #111; border-bottom: 1px solid #282828;
            display: flex; justify-content: space-between; align-items: center;
        }

        .call-btn {
            background: #28a745; color: white; border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; font-size: 0.8rem;
        }

        #messagesBox { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message.mine { background: var(--primary); color: black; align-self: flex-end; padding: 10px; border-radius: 10px; }

        .input-box { padding: 20px; background: #151515; display: flex; gap: 10px; }

        /* --- VIDEO CALL OVERLAY --- */
        #videoOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }

        .video-container { display: flex; gap: 20px; margin-bottom: 20px; }
        video { width: 400px; height: 300px; background: #222; border-radius: 10px; object-fit: cover; border: 2px solid var(--primary); }
        
        .call-controls { display: flex; gap: 15px; }
        .end-call { background: var(--danger) !important; color: white !important; width: auto !important; padding: 10px 30px !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header"><h1>YARTAL HUB</h1></div>
        <div class="create-area">
            <input type="text" id="groupInput" placeholder="Назва гільдії...">
            <button class="btn" id="createBtn">СТВОРИТИ</button>
        </div>
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Шукати...">
        </div>
        <div id="groupsList"></div>
    </div>

    <div class="chat-main">
        <div id="chatHeader">
            <span id="headerTitle">Оберіть гільдію</span>
            <button id="startCall" class="call-btn" style="display: none;">ВІДЕОДЗВІНОК</button>
        </div>

        <div id="videoOverlay">
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div class="call-controls">
                <button class="btn end-call" id="endCallBtn">ЗАВЕРШИТИ</button>
            </div>
        </div>

        <div id="messagesBox"></div>
        
        <div class="input-box" id="msgArea" style="display: none;">
            <input type="text" id="msgInput" placeholder="Повідомлення..." style="margin:0;">
            <button class="btn" id="sendBtn" style="width: 80px;">➤</button>
        </div>
    </div>

    <script>
        let groups = JSON.parse(localStorage.getItem('yartal_save')) || [];
        let activeId = null;
        let localStream = null;

        const elements = {
            groupInput: document.getElementById('groupInput'),
            groupsList: document.getElementById('groupsList'),
            messagesBox: document.getElementById('messagesBox'),
            chatHeader: document.getElementById('headerTitle'),
            msgArea: document.getElementById('msgArea'),
            msgInput: document.getElementById('msgInput'),
            searchInput: document.getElementById('searchInput'),
            videoOverlay: document.getElementById('videoOverlay'),
            localVideo: document.getElementById('localVideo'),
            startCall: document.getElementById('startCall')
        };

        function save() { localStorage.setItem('yartal_save', JSON.stringify(groups)); }

        function renderGroups(filter = "") {
            elements.groupsList.innerHTML = '';
            groups.filter(g => g.name.toLowerCase().includes(filter.toLowerCase())).forEach(g => {
                const div = document.createElement('div');
                div.className = 'group-item' + (g.id === activeId ? ' active' : '');
                div.innerHTML = `<span># ${g.name}</span>`;
                div.onclick = () => openChat(g.id);
                elements.groupsList.appendChild(div);
            });
        }

        function openChat(id) {
            activeId = id;
            const group = groups.find(g => g.id === id);
            elements.chatHeader.innerText = "# " + group.name;
            elements.msgArea.style.display = 'flex';
            elements.startCall.style.display = 'block';
            renderMessages();
            renderGroups(elements.searchInput.value);
        }

        function renderMessages() {
            elements.messagesBox.innerHTML = '';
            const group = groups.find(g => g.id === activeId);
            if (!group) return;
            group.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = 'message mine';
                div.innerText = m;
                elements.messagesBox.appendChild(div);
            });
            elements.messagesBox.scrollTop = elements.messagesBox.scrollHeight;
        }

        // --- ЛОГІКА ВІДЕОДЗВІНКА ---
        async function startVideo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                elements.localVideo.srcObject = localStream;
                elements.videoOverlay.style.display = 'flex';
            } catch (err) {
                alert("Помилка доступу до камери: " + err.message);
            }
        }

        document.getElementById('startCall').onclick = startVideo;

        document.getElementById('endCallBtn').onclick = () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            elements.videoOverlay.style.display = 'none';
        };

        // --- ІНШІ ПОДІЇ ---
        document.getElementById('createBtn').onclick = () => {
            const name = elements.groupInput.value.trim();
            if (name) {
                groups.push({ id: Date.now(), name, messages: [] });
                save();
                elements.groupInput.value = '';
                renderGroups();
            }
        };

        elements.searchInput.oninput = () => renderGroups(elements.searchInput.value);

        document.getElementById('sendBtn').onclick = () => {
            const text = elements.msgInput.value.trim();
            if (text && activeId) {
                groups.find(g => g.id === activeId).messages.push(text);
                save();
                elements.msgInput.value = '';
                renderMessages();
            }
        };

        renderGroups();
    </script>
</body>
</html>
