<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Yartal Hub | Робоча версія</title>
    <style>
        :root { --gold: #b38d1d; --dark: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: sans-serif; background: var(--dark); color: var(--text); margin: 0; display: flex; height: 100vh; }
        
        /* Бокова панель */
        .sidebar { width: 300px; background: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .p-3 { padding: 15px; }
        .header { color: var(--gold); text-align: center; border-bottom: 1px solid #333; }
        
        /* Поля вводу та кнопки */
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #252525; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: var(--gold); border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .btn:hover { background: #d4a724; }

        /* Список груп */
        #groupsList { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .group-item { padding: 15px; background: var(--card); margin-bottom: 8px; border-radius: 5px; cursor: pointer; border-left: 3px solid transparent; transition: 0.3s; }
        .group-item:hover { background: #2a2a2a; }
        .group-item.active { border-left-color: var(--gold); background: #2a2a2a; }

        /* Чат */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 70%; word-wrap: break-word; }
        .sent { background: var(--gold); color: black; align-self: flex-end; }
        .empty-state { margin: auto; opacity: 0.3; text-align: center; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header p-3"><h2>YARTAL HUB</h2></div>
        
        <div class="p-3">
            <input type="text" id="newGroupName" placeholder="Назва гільдії...">
            <button class="btn" onclick="addGroup()">Створити гільдію</button>
        </div>

        <div id="groupsList">
            </div>
    </div>

    <div class="chat-area">
        <div id="messages">
            <div class="empty-state"><h3>Оберіть гільдію зліва</h3></div>
        </div>
        
        <div class="p-3" id="inputSection" style="display: none; background: #181818;">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="messageText" placeholder="Напишіть повідомлення..." style="margin:0;">
                <button class="btn" onclick="sendMessage()" style="width: 100px;">></button>
            </div>
        </div>
    </div>

    <script>
        // Головні дані
        let data = JSON.parse(localStorage.getItem('yartal_db')) || [];
        let currentId = null;

        // Функція відображення списку груп
        function renderGroups() {
            const list = document.getElementById('groupsList');
            list.innerHTML = '';
            
            data.forEach(group => {
                const div = document.createElement('div');
                div.className = 'group-item' + (group.id === currentId ? ' active' : '');
                div.innerHTML = `<strong># ${group.name}</strong>`;
                div.onclick = () => selectGroup(group.id);
                list.appendChild(div);
            });
        }

        // Додавання нової групи
        function addGroup() {
            const input = document.getElementById('newGroupName');
            const name = input.value.trim();
            
            if (name === "") {
                alert("Введіть назву!");
                return;
            }

            const newGroup = {
                id: Date.now(),
                name: name,
                messages: []
            };

            data.push(newGroup);
            localStorage.setItem('yartal_db', JSON.stringify(data)); // Зберігаємо
            input.value = '';
            renderGroups();
        }

        // Вибір групи для чату
        function selectGroup(id) {
            currentId = id;
            document.getElementById('inputSection').style.display = 'block';
            renderGroups();
            renderMessages();
        }

        // Надсилання повідомлення
        function sendMessage() {
            const input = document.getElementById('messageText');
            const text = input.value.trim();
            
            if (text === "" || currentId === null) return;

            const group = data.find(g => g.id === currentId);
            group.messages.push(text);
            
            localStorage.setItem('yartal_db', JSON.stringify(data)); // Зберігаємо
            input.value = '';
            renderMessages();
        }

        // Відображення повідомлень
        function renderMessages() {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            
            const group = data.find(g => g.id === currentId);
            
            if (group.messages.length === 0) {
                container.innerHTML = '<div class="empty-state">Повідомлень ще немає</div>';
            }

            group.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'msg sent';
                div.innerText = msg;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight; // Прокрутка вниз
        }

        // Підтримка клавіші Enter
        document.getElementById('messageText').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Завантаження при старті
        renderGroups();
    </script>

</body>
</html>
